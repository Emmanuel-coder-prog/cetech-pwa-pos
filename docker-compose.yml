services:
  pos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_ORIGIN: ${NEXT_PUBLIC_APP_ORIGIN}

    restart: unless-stopped

    environment:
      NODE_ENV: production

      APP_ENV: ${APP_ENV:-staging}
      APP_ORIGIN: ${APP_ORIGIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      BUILD_ID: ${BUILD_ID:-hetzner-practice}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}

      BRIDGE_BASE_URL: ${BRIDGE_BASE_URL:-}
      BRIDGE_USERNAME: ${BRIDGE_USERNAME:-}
      BRIDGE_APPLICATION_PASSWORD: ${BRIDGE_APPLICATION_PASSWORD:-}

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
